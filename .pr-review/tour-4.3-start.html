<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>#4.3-start · tests: ticket transfer happy paths (service + e2e)</title><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:oklch(0.155 0.004 285);--fg:oklch(0.94 0.002 286);--card:oklch(0.185 0.004 285);
  --raised:oklch(0.215 0.005 285);--muted:oklch(0.24 0.005 285);--mfg:oklch(0.68 0.006 286);
  --dim:oklch(0.52 0.006 286);--border:oklch(1 0 0 / 0.09);--border2:oklch(1 0 0 / 0.14);--faint:oklch(1 0 0 / 0.035);
  --red:oklch(0.704 0.191 22.2);--red-bg:oklch(0.704 0.191 22.2 / 0.12);
  --amber:oklch(0.8 0.14 75);--amber-bg:oklch(0.8 0.14 75 / 0.11);
  --green:oklch(0.76 0.15 152);--green-bg:oklch(0.76 0.15 152 / 0.10);
  --blue:oklch(0.74 0.11 250);--blue-bg:oklch(0.74 0.11 250 / 0.12);
  --add:oklch(0.76 0.15 152 / 0.09);--add-g:oklch(0.76 0.15 152 / 0.55);--del:oklch(0.704 0.191 22.2 / 0.09);--del-g:oklch(0.704 0.191 22.2 / 0.55);
  --r:6px;--sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
::selection{background:oklch(0.35 0.01 286);color:#fff}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:2px}
code,.mono,.num{font-family:var(--mono);font-size:13.5px}.num{font-variant-numeric:tabular-nums}
code{background:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:13px}
b{font-weight:600}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px 64px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in oklch,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:48px;padding-bottom:0}
.mark{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-0.01em}
.mark i{width:18px;height:18px;border-radius:5px;background:var(--fg);display:inline-block;position:relative}
.mark i:after{content:"";position:absolute;inset:5px 5px auto 5px;height:2px;background:var(--bg);box-shadow:0 3px 0 var(--bg),0 6px 0 var(--bg)}
.sep{color:var(--dim)}.meta{color:var(--mfg)}.grow{flex:1}
h1{font-size:22.5px;font-weight:600;letter-spacing:-0.02em;margin:28px 0 4px;line-height:1.3}
h2{font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--mfg);margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
.sub{color:var(--mfg);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.box{border:1px solid var(--border);border-radius:var(--r);background:var(--card)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:20px}
.strip>div{padding:12px 14px;border-left:1px solid var(--border)}.strip>div:first-child{border-left:0}
.strip .k{font-size:12.5px;color:var(--mfg)}.strip .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-0.02em}
.strip .v small{font-family:var(--sans);font-size:13.5px;color:var(--dim);margin-left:6px;letter-spacing:0}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:500;color:var(--mfg);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--faint)}
td.r,th.r{text-align:right}
.sev,.tag,.chip,.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--border2);padding:0 7px;height:18px;font-size:12px;font-weight:500;white-space:nowrap;letter-spacing:0.01em}
.sev{text-transform:uppercase;font-size:11px;letter-spacing:0.04em}
.sev-high{color:var(--red);background:var(--red-bg);border-color:oklch(0.704 0.191 22.2 / 0.3)}
.sev-medium{color:var(--amber);background:var(--amber-bg);border-color:oklch(0.8 0.14 75 / 0.28)}
.sev-low{color:var(--mfg)}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:0.05em;border-radius:4px;height:17px;padding:0 5px}
.tag-fact{color:var(--fg);background:var(--muted)}
.tag-model{color:var(--blue);background:var(--blue-bg);border-color:oklch(0.74 0.11 250 / 0.3)}
.tag-ask{color:var(--amber);background:var(--amber-bg);border-color:oklch(0.8 0.14 75 / 0.28)}
.tag-src{color:var(--mfg);background:transparent}
.imap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);border-top:1px solid var(--border)}
.imap:first-of-type{border-top:0}
.imap>div{padding:8px 0}.imap>div:first-child{padding-right:16px}
.imap .files{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.fchip{font-family:var(--mono);font-size:12.5px;border:1px solid var(--border2);border-radius:4px;padding:1px 6px;color:var(--fg);background:var(--muted)}
.fchip.dim{color:var(--mfg);background:transparent}
.fchip.warn{color:var(--amber);background:var(--amber-bg);border-color:oklch(0.8 0.14 75 / 0.28)}
.fchip.bad{color:var(--red);background:var(--red-bg);border-color:oklch(0.704 0.191 22.2 / 0.3)}
.imap-h{font-size:12.5px;color:var(--dim);margin:12px 0 2px}
.chip{color:var(--mfg);font-family:var(--mono);font-size:12px;border-radius:4px}
.chip .p{color:var(--fg)}.chip.neg .p{color:var(--green)}
.pill{color:var(--mfg)}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:22px;border-radius:5px;font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;border:1px solid var(--border2)}
.score.high{color:var(--red);background:var(--red-bg);border-color:oklch(0.704 0.191 22.2 / 0.3)}
.score.medium{color:var(--amber);background:var(--amber-bg);border-color:oklch(0.8 0.14 75 / 0.28)}
.score.low{color:var(--fg)}.score.none{color:var(--dim)}
.plus{color:var(--green)}.minus{color:var(--red)}
.att{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:20px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;border:1px solid var(--border2);white-space:nowrap}
.att-critical{color:var(--bg);background:var(--red);border-color:var(--red)}
.att-high{color:var(--red);background:var(--red-bg);border-color:oklch(0.704 0.191 22.2 / 0.35)}
.att-medium{color:var(--amber);background:var(--amber-bg);border-color:oklch(0.8 0.14 75 / 0.3)}
.att-low{color:var(--mfg)}.att-none{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
.what{margin-top:5px;max-width:70ch;color:var(--fg)}
.whyline{margin-top:3px;color:var(--mfg);max-width:74ch;font-size:14px}
.whyline .ev,.facts a{text-decoration:none}.whyline .ev{color:var(--blue);font-size:13px}
.go{font-size:13.5px;color:var(--fg);white-space:nowrap;border:1px solid var(--border2);border-radius:5px;padding:3px 8px}.go:hover{background:var(--faint);text-decoration:none}
.attbox{margin-top:18px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.attbox .t{flex:1}.attbox .t div{color:var(--mfg);font-size:14px;margin-top:2px}
.rank{color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums}
.title{font-weight:500}.title .n{color:var(--dim);font-family:var(--mono);font-weight:400;margin-left:6px;font-size:13.5px}
.expl{color:var(--mfg);margin-top:3px;max-width:62ch}
.facts{margin-top:5px;display:flex;flex-direction:column;gap:2px}.facts div{color:var(--mfg);font-size:13.5px}
.facts div:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.ev{color:var(--dim);font-size:12.5px;margin-top:3px;font-family:var(--mono)}
.rule-when{font-family:var(--mono);font-size:13px;color:var(--mfg)}
.model{border-left:2px solid oklch(0.74 0.11 250 / 0.5);padding:2px 0 2px 12px}
.note{color:var(--mfg);font-size:13.5px;margin-top:6px}
.footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--border);color:var(--dim);font-size:13.5px;display:flex;gap:16px;flex-wrap:wrap}
/* tour */
.why{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.why>section{padding:16px 18px;border-top:1px solid var(--border)}
.why>section:nth-child(-n+2){border-top:0}.why>section:nth-child(even){border-left:1px solid var(--border)}
.why>section.full{grid-column:1/-1;border-left:0}
.why h3{font-size:12.5px;font-weight:500;color:var(--mfg);margin:0 0 8px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:0.06em}
.quote{border-left:2px solid var(--border2);padding-left:12px;color:var(--fg);white-space:pre-wrap;font-size:14px;max-height:220px;overflow:auto}
.src{color:var(--dim);font-size:12.5px;margin-bottom:4px}
.unknown{display:flex;gap:10px;align-items:flex-start}.unknown p{margin:0;color:var(--mfg)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:62px 78px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--border);align-items:start}
.item:first-child{border-top:0;padding-top:0}
.item .loc{font-family:var(--mono);font-size:13px;color:var(--mfg)}
.item .why-t{color:var(--mfg);font-size:13.5px;margin-top:2px}
.claim{padding:8px 0;border-top:1px solid var(--border)}.claim:first-child{border-top:0;padding-top:0}
.claim q,.imap q{font-style:normal;color:var(--fg)}.claim q:before,.imap q:before{content:"\201C"}.claim q:after,.imap q:after{content:"\201D"}
.toc{counter-reset:s}
.toc a{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;padding:6px 12px;border-bottom:1px solid var(--border);align-items:center}
.toc a:last-child{border-bottom:0}.toc a:hover{background:var(--faint);text-decoration:none}
.toc .i{color:var(--dim);font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.toc .p{font-family:var(--mono);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc .w{color:var(--dim);font-size:13px;white-space:nowrap}
.toc a.test .p{padding-left:16px;color:var(--mfg)}.toc a.test .p:before{content:"└ ";color:var(--dim)}
.toc .d{font-family:var(--mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.file{margin-top:14px;overflow:clip}
.file.test{margin-left:22px}
.fh{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--raised);position:sticky;top:48px;z-index:2}
.fh .step{font-family:var(--mono);font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:18px}
.fh .path{font-family:var(--mono);font-size:14px;font-weight:500}
.fh .old{font-family:var(--mono);font-size:13px;color:var(--dim)}
.fh .pos{color:var(--dim);font-size:13px}
.fnote{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--mfg);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.diff{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.diff td{padding:0;border:0;vertical-align:top}.diff tr:hover td{background:none}
.diff .ln{width:1%;min-width:44px;padding:0 8px;text-align:right;color:var(--dim);user-select:none;font-variant-numeric:tabular-nums;font-size:12.5px}
.diff .code{white-space:pre-wrap;word-break:break-word;padding:0 12px 0 14px;position:relative}
.diff tr.add .code{background:var(--add)}.diff tr.add .ln{background:var(--add)}.diff tr.add .code:before{content:"+";position:absolute;left:3px;color:var(--add-g)}
.diff tr.del .code{background:var(--del)}.diff tr.del .ln{background:var(--del)}.diff tr.del .code:before{content:"−";position:absolute;left:3px;color:var(--del-g)}
.diff tr.hunk td{background:var(--faint);color:var(--dim);padding:3px 12px;font-size:12.5px}
.diff tr.flag .ln:first-child{box-shadow:inset 2px 0 0 var(--red)}
.diff tr.flag.medium .ln:first-child{box-shadow:inset 2px 0 0 var(--amber)}
.diff tr.flag.low .ln:first-child{box-shadow:inset 2px 0 0 var(--dim)}
.diff tr.ann td{padding:0}
.ann-box{margin:4px 12px 6px 104px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);font-family:var(--sans);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.ann-box .t{flex:1}.ann-box .t div{color:var(--mfg);font-size:13.5px;margin-top:2px}
.hl-k{color:oklch(0.77 0.1 300)}.hl-s{color:oklch(0.8 0.08 190)}.hl-n{color:oklch(0.8 0.09 330)}.hl-c{color:var(--dim);font-style:italic}.hl-t{color:oklch(0.83 0.07 250)}.hl-f{color:oklch(0.86 0.05 250)}.hl-p{color:oklch(0.8 0.05 250)}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary .caret{display:inline-block;transition:transform .15s;color:var(--dim)}details[open]>summary .caret{transform:rotate(90deg)}
.noise summary.nh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.noise .row{border-top:1px solid var(--border)}
.noise .row>summary{display:grid;grid-template-columns:14px minmax(0,1fr) 140px 90px;gap:10px;padding:6px 12px;align-items:center}
.noise .row>summary:hover{background:var(--faint)}
.noise .row .p{font-family:var(--mono);font-size:13.5px;color:var(--mfg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more>summary{padding:8px 12px;color:var(--mfg);font-size:13.5px}
.empty{color:var(--dim);padding:4px 0}
@media (max-width:820px){.why{grid-template-columns:1fr}.why>section:nth-child(even){border-left:0}.why>section:nth-child(2){border-top:1px solid var(--border)}.hide-sm{display:none}.item{grid-template-columns:1fr}.ann-box{margin-left:12px}.file.test{margin-left:8px}.wrap{padding:0 16px 48px}}

/* ---------- app shell (viewer) ---------- */
.topbar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in oklch,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar .t-title{font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .t-num{color:var(--dim);font-family:var(--mono);font-weight:400;margin-left:6px;font-size:13.5px}
.topbar .vsep{width:1px;height:18px;background:var(--border2)}
.menu{display:none;border:1px solid var(--border2);border-radius:5px;background:none;color:var(--fg);padding:3px 8px;font:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr)}
.side{position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;border-right:1px solid var(--border);padding:14px 0 40px;background:var(--bg)}
.side-sec{padding:0 10px 16px}
.side-label{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--dim);padding:6px 8px}
.outline,.flist{list-style:none;margin:0;padding:0}
.outline a,.flist a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 8px;border-radius:5px;color:var(--mfg);font-size:14px;text-decoration:none;border-left:2px solid transparent}
.outline a:hover,.flist a:hover{background:var(--faint);color:var(--fg)}
.outline a.is-active{color:var(--fg);background:var(--faint);border-left-color:var(--blue)}
.outline .o-num{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.outline .o-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline li.sub a{padding-left:18px}.outline li.sub .o-txt{font-family:var(--mono);font-size:13px}
.outline li.chap a{color:var(--fg);font-weight:500;margin-top:4px}
.flist a{grid-template-columns:14px minmax(0,1fr) auto 8px;font-family:var(--mono);font-size:13px}
.flist .st{font-weight:600;font-size:12px}.st-A{color:var(--green)}.st-M{color:var(--amber)}.st-D{color:var(--red)}.st-R{color:var(--blue)}
.flist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist .dd{font-size:12px;white-space:nowrap}
.flist .dot{width:6px;height:6px;border-radius:50%}.dot-high{background:var(--red)}.dot-medium{background:var(--amber)}
.flist a.noise .nm{color:var(--dim)}
.main{padding:24px 32px 80px;max-width:1040px;min-width:0}
.sec{scroll-margin-top:64px;margin-top:28px}.sec:first-child{margin-top:0}
.sec-h{font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--mfg);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-h .count{color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
/* TL;DR */
.tldr{padding:18px 22px}
.tl-head{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}
.tl-tag{font-family:var(--mono);font-size:12.5px;color:var(--blue);letter-spacing:0.05em;flex:none}
.tl-head h1{margin:0;font-size:20px;line-height:1.35}
.tl-rows{display:grid;grid-template-columns:92px minmax(0,1fr);gap:9px 16px;margin:0}
.tl-rows dt{color:var(--mfg);font-weight:500;font-size:14px;padding-top:1px}
.tl-rows dd{margin:0;font-size:14.5px;line-height:1.55}
.tl-rows .src-note{color:var(--dim);font-size:13px;margin-left:6px}
.unk{color:var(--red)}
/* overview */
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:pt}
.points li{counter-increment:pt;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--card)}
.points li:before{content:counter(pt);font-family:var(--mono);color:var(--blue);font-size:13.5px;padding-top:1px}
a.kw{color:var(--blue)}
/* shape */
.shape{display:grid;gap:10px}
.shape .box{overflow:hidden}
.shape-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--raised);font-weight:500}
.shape pre{margin:0;padding:10px 0;font-family:var(--mono);font-size:13.5px;line-height:1.6;overflow:auto}
.shape pre span.ln{display:block;padding:0 14px;white-space:pre}
.shape pre span.add{background:var(--add)}.shape pre span.del{background:var(--del)}
/* evidence */
.ev-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ev-grid>section{padding:16px 18px}.ev-grid>section+section{border-left:1px solid var(--border)}
.ev-grid>section.full{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}
.ev-grid h3{font-size:12.5px;font-weight:500;color:var(--mfg);margin:0 0 8px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:0.06em}
/* walkthrough */
.chapter{scroll-margin-top:64px;margin-top:34px}
.ch-head{display:flex;align-items:baseline;gap:10px}
.ch-num{font-family:var(--mono);color:var(--blue);font-size:14.5px}
.ch-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.01em;text-transform:none;color:var(--fg)}
.ch-desc{color:var(--mfg);margin:4px 0 0 23px;max-width:80ch}
.file{scroll-margin-top:64px}
.fh{top:52px}
.fnote-md{padding:10px 14px;border-bottom:1px solid var(--border);font-size:14.5px}
.fnote-md .mtag{float:right;margin-left:8px}
.fnote-md p{margin:0 0 4px}.fnote-md ul{margin:4px 0 0;padding-left:18px;color:var(--mfg)}.fnote-md li{margin:2px 0}
details.codefold>summary{padding:8px 12px;color:var(--mfg);font-size:13.5px;border-bottom:1px solid transparent}
details.codefold[open]>summary{border-bottom-color:var(--border)}
.overlay{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:52px;width:310px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.is-open{transform:none}
  .overlay.is-open{display:block;position:fixed;inset:52px 0 0 0;background:oklch(0 0 0 / 0.5);z-index:25}
  .menu{display:inline-block}
  .main{padding:18px 16px 60px}
  .ev-grid{grid-template-columns:1fr}.ev-grid>section+section{border-left:0;border-top:1px solid var(--border)}
  .tl-rows{grid-template-columns:1fr}.tl-rows dt{padding-top:6px}
  .tldr{padding:14px}.tl-head{flex-direction:column;gap:4px}.tl-head h1{font-size:17.5px}
  .topbar{gap:8px;padding:0 10px}.topbar .t-title{font-size:14.5px}
}
.diff tr.pulse td{animation:pulse 1.6s ease-out}
@keyframes pulse{0%{background:oklch(0.74 0.11 250 / 0.35)}100%{background:transparent}}
.noscript{max-width:640px;margin:80px auto;padding:0 16px;color:var(--mfg)}

/* diagrams */
.dgm-box{overflow:hidden}
.dgm{padding:14px 10px;overflow:auto;text-align:center}
.dgm svg{max-width:100%;height:auto}
.dgm-cap{padding:8px 14px;border-top:1px solid var(--border);color:var(--mfg);font-size:14px}
.dgm-fail{margin:0;padding:12px 14px;color:var(--mfg);font-family:var(--mono);font-size:13.5px;white-space:pre-wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:12px;height:8px;border-radius:2px;border:1.5px solid}
.lg-hot{border-color:#f0706e}.lg-warn{border-color:#e9b04a}.lg-test{border-color:#6e6e76}
.cmap svg g{transition:opacity .15s}.cmap svg g[style*="pointer"]:hover{opacity:.8}
.dgm svg{--bg:var(--card)!important;background:transparent!important}
.dgm svg text{font-family:var(--sans)!important}

/* queue rows open their tour */
tr.qrow{cursor:pointer}
tr.qrow:hover td{background:oklch(1 0 0 / 0.045)}
tr.qrow:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
tr.qrow:hover .title>a:first-child{text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:3px}
.go-tour{color:var(--green);background:var(--green-bg);border-color:oklch(0.76 0.15 152 / 0.35);font-weight:500}
.go-tour:hover{background:oklch(0.76 0.15 152 / 0.2)}
tr.qrow:hover .go-tour{background:oklch(0.76 0.15 152 / 0.2)}
.pill.repo{font-family:var(--mono);margin-right:8px;color:var(--fg)}
.rfilter{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mfg);display:flex;gap:6px;align-items:center}
.rfilter select{font:inherit;color:var(--fg);background:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:2px 6px}
tr[hidden]{display:none}
</style></head>

(user.email, email));","n":24},{"t":"add","s":"  if (!friend) throw new OrderError(\"No TicketBay account uses this email. Ask your friend to sign up first.\");","n":25},{"t":"add","s":"  if (friend.id === userId) throw new OrderError(\"These tickets are already yours.\");","n":26},{"t":"add","s":"","n":27},{"t":"add","s":"  if (!(await setHolder(db, orderId, friend.id))) throw new OrderError(\"Only a paid order can be transferred.\");","n":28},{"t":"add","s":"  return (await getOrder(db, orderId))!;","n":29},{"t":"add","s":"}","n":30}]}]},{"path":"tests/integration/transfers.test.ts","oldPath":null,"status":"added","similarity":null,"binary":false,"additions":50,"deletions":0,"kind":"test","noise":null,"areas":[],"hunks":[{"header":"@@ -0,0 +1,50 @@","context":"","lines":[{"t":"add","s":"// Ticket transfer at the service layer, against a real Postgres","n":1},{"t":"add","s":"// (Testcontainers): the owner gives a paid order's tickets to a friend's","n":2},{"t":"add","s":"// account, and My orders follows the tickets. Real Better Auth accounts, the","n":3},{"t":"add","s":"// fake Stripe.","n":4},{"t":"add","s":"import { describe, it, expect } from \"vitest\";","n":5},{"t":"add","s":"import { listOrdersByUser } from \"../../src/db/orders-repo\";","n":6},{"t":"add","s":"import { createFakeStripe } from \"../../src/payments\";","n":7},{"t":"add","s":"import { placeOrder, type Deps } from \"../../src/services/orders\";","n":8},{"t":"add","s":"import { transferOrder } from \"../../src/services/transfers\";","n":9},{"t":"add","s":"import { useTestDatabase } from \"./database\";","n":10},{"t":"add","s":"import { NOW, venue } from \"./fixtures\";","n":11},{"t":"add","s":"import { customer, makeAuth, useCleanAccounts } from \"./accounts\";","n":12},{"t":"add","s":"","n":13},{"t":"add","s":"const t = useTestDatabase();","n":14},{"t":"add","s":"useCleanAccounts(t);","n":15},{"t":"add","s":"","n":16},{"t":"add","s":"let keys = 0;","n":17},{"t":"add","s":"function deps(nowMs = N OrdersByUser(t.db, bela.id)).map((r) => r.order.id)).toEqual([order.id]);","n":47},{"t":"add","s":"    expect(await listOrdersByUser(t.db, anna.id)).toEqual([]);","n":48},{"t":"add","s":"  });","n":49},{"t":"add","s":"});","n":50}]}]}],"why":"A customer can give the tickets of a paid order to a friend.","diagrams":[{"title":"Who follows the holder, who follows the booker","kind":"flowchart","mermaid":"flowchart LR\n  T[\"transferOrder\"] --> H[\"holder = holder_id ?? user_id\"]\n  P[\"order page gate\"] --> H\n  L[\"listOrdersByUser: My orders, MCP my_orders\"] --> H\n  X[\"cancel: web action, REST cancel, MCP refund_order\"] --> C[\"cancelOwnOrder (not in the diff)\"]\n  C --> B[\"booker = user_id\"]","caption":"Three readers resolve the holder. Every refund path resolves the booker, in `src/services/orders.ts:338`."}],"showChangeMap":true,"points":["orders get a nullable [holder_id](src/db/schema.ts:67); `holderOf` returns the holder, else the booker","[transferOrder](src/services/transfers.ts:16) checks holder and paid status, finds the friend by lowercased email, then calls `setHolder`","[My orders](src/db/orders-repo.ts:56), the [order page](app/(public)/orders/[id]/page.tsx:31) and the MCP `my_orders` tool key on the holder","two entry points: a [form](app/(public)/orders/[id]/transfer-form.tsx) on the order page and [POST /api/v1/orders/{id}/transfer](src/api/v1.ts:256)","nothing in the diff reads the event start or changes `cancelOwnOrder`; spec criteria 3 and 5 have no line to point at","[retries: 2](playwright.config.ts:11) for every e2e test arrives in the tests commit with no stated reason"],"shape":[{"title":"What transferOrder checks, in order","kind":"call-tree","lang":"text","code":"transferOrder({ db }, userId, orderId, friendEmail)\n  getOrder(orderId)\n  holderOf(order) === userId        else \"Order not found.\"\n  order.status === \"paid\"           else \"Only a paid order can be transferred.\"\n  user WHERE email = lower(trim)    else \"No Tic ansfer/route.ts","ticket-transfer-4.3-start.md":"docs/specs/ticket-transfer-4.3-start.md","0003_order_holder.sql":"drizzle/0003_order_holder.sql","env.ts":"e2e/support/env.ts","transfer.spec.ts":"e2e/transfer.spec.ts","playwright.config.ts":"playwright.config.ts","v1.ts":"src/api/v1.ts","orders-repo.ts":"src/db/orders-repo.ts","schema.ts":"src/db/schema.ts","transfers.ts":"src/services/transfers.ts","transfers.test.ts":"tests/integration/transfers.test.ts"},"mermaid":"flowchart LR\n  subgraph L0[\"other\"]\n    n0[\"README.md\"]\n    n6[\"ticket-transfer-4.3-start.md\"]\n  end\n  subgraph L1[\"UI & entry points\"]\n    n1[\"actions.ts\"]\n    n2[\"[id]/page.tsx\"]\n    n3[\"transfer-form.tsx\"]\n    n4[\"orders/page.tsx\"]\n  end\n  subgraph L2[\"services & data\"]\n    n5[\"route.ts\"]\n    n11[\"v1.ts\"]\n    n12[\"orders-repo.ts\"]\n    n14[\"transfers.ts\"]\n  end\n  subgraph L3[\"contracts & schema\"]\n    n7[\"0003_order_holder.sql\"]\n    n13[\"schema.ts\"]\n  end\n  subgraph L4[\"tests\"]\n    n8[\"env.ts\"]\n    n9[\"transfer.spec.ts\"]\n    n15[\"transfers.test.ts\"]\n  end\n  subgraph L5[\"config & scripts\"]\n    n10[\"playwright.config.ts\"]\n  end\n  n1 --> n14\n  n2 --> n12\n  n2 --> n3\n  n3 --> n1\n  n4 --> n12\n  n5 --> n11\n  n9 --> n8\n  n10 --> n8\n  n11 --> n13\n  n11 --> n14\n  n12 --> n13\n  n14 --> n12\n  n14 --> n13\n  n15 --> n12\n  n15 --> n14\n  classDef hot stroke:#f0706e,stroke-width:2px,color:#f0706e\n  classDef warn stroke:#e9b04a,stroke-width:1.5px,color:#e9b04a\n  classDef test stroke:#6e6e76,color:#a0a0a8\n  class n2 warn\n  class n8 test\n  class n9 test\n  class n10 warn\n  class n12 warn\n  class n14 hot\n  class n15 warn"}}}}</script>
<script>// PR review viewer: builds the queue and every tour from the JSON embedded in
// the page. Plain JavaScript, no dependencies, no network. The page adds no
// facts; it is a view of triage.json and tour-<n>.json.
// Source of truth: shared/viewer/viewer.js in github.com/dmoka/skills.
(() => {
  "use strict";

  const DATA = JSON.parse(document.getElementById("data").textContent);
  const app = document.getElementById("app");
  const LEVELS = ["critical", "high", "medium", "low"];
  const SEV = { high: 0, medium: 1, low: 2 };

  // ---------- text ----------
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const fmt = (n) => Number(n || 0).toLocaleString("en");
  const age = (d) => (d == null ? "—" : d === 0 ? "today" : `${d}d`);
  const when = (iso) => (iso ? new Date(iso).toISOString().replace("T", " ").slice(0, 16) + " UTC" : "");
  const base = (p) => String(p).split("/").pop();
  const short = (p) => String(p).split("/").slice(-2).join("/");

  // Inline markdown: `code`, **bold**, [keyword](path[:line]) links.
  function inline(s, link) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\(((?:[^()]|\([^()]*\))+)\)/g, (m, text, target) => {
        const href = link ? link(target.replace(/&amp;/g, "&")) : null;
        return href ? `<a class="kw" href="${href}">${text}</a>` : text;
      });
  }
  // Block markdown: paragraphs and "- " bullets.
  function block(s, link) {
    const out = [];
    let list = null;
    for (const raw of String(s ?? "").split("\n")) {
      const line = raw.trim();
      if (/^[-*] /.test(line)) { (list ??= []).push(`<li>${inline(line.slice(2), link)}</li>`); continue; }
      if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
      if (line) out.push(`<p>${inline(line, link)}</p>`);
    }
    if (list) out.push(`<ul>${list.join("")}</ul>`);
    return out.join("");
  }

  // ---------- syntax highlight (tiny, per line) ----------
  const KW = {
    js: "abstract as async await break case catch class const continue debugger default delete do else enum export extends false finally for from function get if implements import in instanceof interface let new null of private protected public readonly return satisfies set static super switch this throw true try type typeof undefined var void while with yield",
    py: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return self True try while with yield",
    sql: "add alter and as begin by cascade check column commit constraint create default delete desc distinct drop exists foreign from group having if in index insert into is join key left limit not null on or order primary references rename select set table to transaction truncate unique update using values where",
    go: "break case chan const continue default defer else fallthrough for func go goto if import interface map nil package range return select struct switch type var true false",
    generic: "if else for while return class function def fn let const var true false null nil new public private static import package use struct enum match impl pub mut",
  };
  const kwSets = Object.fromEntries(Object.entries(KW).map(([k, v]) => [k, new Set(v.split(" "))]));
  function langOf(path) {
    const ext = (String(path).split(".").pop() || "").toLowerCase();
    if (["ts", "tsx", "js", "jsx", "mjs", "cjs", "vue", "svelte"].includes(ext)) return "js";
    if (ext === "py") return "py";
    if (ext === "sql") return "sql";
    if (ext === "go") return "go";
    if (["json", "jsonc"].includes(ext)) return "json";
    if (["css", "scss"].includes(ext)) return "css";
    if (["md", "txt", "lock", "yaml", "yml", "toml"].includes(ext)) return "plain";
    return "generic";
  }
  function highlight(line, lang) {
    if (lang === "plain" || line.length > 400) return esc(line);
    const comment = lang === "py" ? /^#.*/ : lang === "sql" ? /^--.*/ : /^\/\/.*|^\/\*.*?(\*\/|$)/;
    const kws = kwSets[lang] ?? (lang === "json" || lang === "css" ? new Set() : kwSets.generic);
    const ci = lang === "sql";
    let out = "", i = 0, m;
    while (i < line.length) {
      const rest = line.slice(i);
      if ((m = rest.match(comment))) { out += `<span class="hl-c">${esc(m[0])}</span>`; i += m[0].length; continue; }
      if ((m = rest.match(/^("(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?|`(?:[^`\\]|\\.)*`?)/))) {
        const isKey = lang === "json" && /^\s*:/.test(line.slice(i + m[0].length));
        out += `<span class="${isKey ? "hl-p" : "hl-s"}">${esc(m[0])}</span>`; i += m[0].length; continue;
      }
      if ((m = rest.match(/^\b\d[\d_]*(\.\d+)?([eE][+-]?\d+)?n?\b/))) { out += `<span class="hl-n">${esc(m[0])}</span>`; i += m[0].length; continue; }
      if ((m = rest.match(/^[A-Za-z_$][\w$]*/))) {
        const w = m[0];
        if (kws.has(ci ? w.toLowerCase() : w)) out += `<span class="hl-k">${esc(w)}</span>`;
        else if (/^[A-Z][A-Za-z0-9]*$/.test(w) && lang !== "sql") out += `<span class="hl-t">${esc(w)}</span>`;
        else if (line[i + w.length] === "(") out += `<span class="hl-f">${esc(w)}</span>`;
        else out += esc(w);
        i += w.length; continue;
      }
      out += esc(line[i]); i++;
    }
    return out;
  }

  // ---------- badges ----------
  const att = (lvl) => (lvl ? `<span class="att att-${esc(lvl)}">${esc(lvl)}</span>` : `<span class="att att-none">not judged</span>`);
  const sev = (s) => `<span class="sev sev-${esc(s)}">${esc(s)}</span>`;
  const src = (s) => (s === "fact" ? `<span class="tag tag-fact" title="Computed by a script from the diff">FACT</span>`
    : s === "map" ? `<span class="tag tag-ask" title="Nothing the author wrote explains this file">ASK WHY</span>`
    : `<span class="tag tag-model" title="Written by the model; file and line checked by the gate">LOOK HERE</span>`);
  const MODEL = `<span class="tag tag-model">MODEL</span>`;

  // ---------- routing ----------
  // #/            the queue (or the only tour)
  // #/pr/9        a tour
  // #/pr/9?at=x   a tour, scrolled to element x
  const tourKeys = Object.keys(DATA.tours ?? {});
  let current = null;
  function parse() {
    const m = location.hash.match(/^#\/pr\/([^?]+)(?:\?at=(.+))?$/);
    if (m) return { pr: decodeURIComponent(m[1]), at: m[2] ? decodeURIComponent(m[2]) : null };
    if (!DATA.triage && tourKeys.length) return { pr: tourKeys[0], at: null };
    return { pr: null, at: null };
  }
  function route() {
    const r = parse();
    const key = r.pr ? `pr:${r.pr}` : "queue";
    if (key !== current) {
      current = key;
      if (r.pr && DATA.tours?.[r.pr]) app.innerHTML = renderTour(DATA.tours[r.pr], r.pr);
      else app.innerHTML = DATA.triage ? renderQueue(DATA.triage) : `<div class="main"><p class="empty">Nothing to show.</p></div>`;
      const tour = r.pr && DATA.tours?.[r.pr];
      document.title = tour ? `${tour.read ? `${tour.repo}` : ""}#${tour.pr.number} · ${tour.pr.title}` : `Triage · ${repoLabel(DATA.triage)}`;
      wire();
      if (!r.at) window.scrollTo(0, 0);
    }
    if (r.at) jump(r.at);
  }
  function jump(id) {
    const el = document.getElementById(id);
    if (!el) return;
    for (let d = el.closest("details"); d; d = d.parentElement?.closest("details")) d.open = true;
    el.scrollIntoView({ block: /-[no]\d+$/.test(id) ? "center" : "start" });
    if (el.tagName === "TR") { el.classList.add("pulse"); setTimeout(() => el.classList.remove("pulse"), 1600); }
  }
  window.addEventListener("hashchange", route);

  // ---------- queue ----------
  // One repo: a PR is keyed by its number. Many repos: by "<repo slug>-<number>",
  // and each row carries its repo.
  const keyOf = (p) => String(p.key ?? p.number);
  const prHref = (p) => `#/pr/${encodeURIComponent(keyOf(p))}`;
  // Many repos: count the triaged ones; the others are counted apart.
  const repoLabel = (t) => {
    if (t?.repo || !t?.repos) return t?.repo ?? "";
    const off = t.repos.filter((r) => !r.ready).length;
    return plural(t.repos.length - off, "repo") + (off ? ` · ${off} not triaged` : "");
  };
  let repoFilter = "";
  function renderQueue(t) {
    const prs = t.prs;
    const judged = prs.filter((p) => p.attention).length;
    const count = (lvl) => prs.filter((p) => p.attention?.level === lvl).length;
    const at = (p, file, line, side) => {
      const tour = DATA.tours?.[keyOf(p)];
      const i = tour ? tour.order.findIndex((o) => o.path === file) : -1;
      return i < 0 ? prHref(p) : `${prHref(p)}?at=f${i}${line != null ? (side === "old" ? "-o" : "-n") + line : ""}`;
    };
    const rows = prs.map((p, i) => {
      const a = p.attention;
      const has = !!DATA.tours?.[keyOf(p)];
      return `<tr${has ? ` class="qrow" tabindex="0" data-href="${prHref(p)}" aria-label="Open the tour of #${p.number}"` : ""}${p.repo ? ` data-repo="${esc(p.repo)}"` : ""}${repoFilter && p.repo !== repoFilter ? " hidden" : ""}>
  <td class="rank r">${p.rank ?? i + 1}</td>
  <td>${att(a?.level)}</td>
  <td>
    <div class="title">${p.repo ? `<span class="pill repo" title="${esc(p.repoId ?? p.repo)}">${esc(p.repo)}</span>` : ""}<a href="${has ? prHref(p) : esc(p.url)}">${esc(p.title)}</a><a class="n" href="${esc(p.url)}">#${p.number}</a><span class="n" style="font-family:var(--sans)">${esc(p.author ?? "")}</span>${p.draft ? ` <span class="pill">draft</span>` : ""}${(p.labels ?? []).map((l) => ` <span class="pill">${esc(l)}</span>`).join("")}</div>
    ${a ? `<div class="model what">${inline(a.whatHappened)}</div><div class="whyline">${inline(a.why)}${a.file ? ` <a class="mono ev" href="${at(p, a.file, a.line, a.side)}">${esc(base(a.file))}${a.line != null ? ":" + a.line : ""}</a>` : ""}</div>` : ""}
    ${p.highFacts?.length ? `<div class="facts">${p.highFacts.slice(0, 3).map((f) => `<div>${inline(f.text)} <a class="mono" style="color:var(--dim)" href="${at(p, f.file, f.line, f.side)}">${esc(base(f.file))}${f.line ? ":" + f.line : ""}</a></div>`).join("")}</div>` : ""}
  </td>
  <td class="r num">${fmt(p.readLines)}<div style="color:var(--dim);white-space:nowrap">${p.noiseLines ? `+${fmt(p.noiseLines)} noise` : plural(p.filesChanged, "file")}</div></td>
  <td class="r num">${age(p.ageDays)}</td>
  <td class="r">${has ? `<a class="go go-tour" href="${prHref(p)}">Tour →</a>` : ""}</td>
</tr>`;
    }).join("");
    const byKey = new Map(prs.map((p) => [keyOf(p), p]));
    const chip = (k) => { const p = byKey.get(String(k)); return `<a class="fchip" href="#/pr/${encodeURIComponent(k)}">${p?.repo ? esc(p.repo.split("/").pop()) : ""}#${esc(p?.number ?? k)}</a>`; };
    const overlaps = (t.overlaps ?? []).length ? `
<section class="sec"><div class="sec-h">PRs that change the same files <span class="count">merge order matters</span></div>
<div class="box"><table><tbody>${t.overlaps.slice(0, 12).map((o) => `<tr><td class="mono" style="width:55%">${o.repo ? `<span class="pill">${esc(o.repo)}</span> ` : ""}${esc(o.file)}</td><td>${o.prs.map(chip).join(" ")}</td></tr>`).join("")}${t.overlaps.length > 12 ? `<tr><td colspan="2" class="empty">+${t.overlaps.length - 12} more files</td></tr>` : ""}</tbody></table></div></section>` : "";
    // Many repos: the ones the login check stopped, and PRs that could not be read, go first.
    const blocked = (t.repos ?? []).filter((r) => !r.ready || r.skipped?.length);
    const notTriaged = blocked.length ? `
<section class="sec"><div class="sec-h">Not triaged <span class="count">fix these, then run again</span></div>
<div class="box"><table><tbody>${blocked.map((r) => `<tr><td class="mono" style="width:34%">${esc(r.id)}</td><td>${r.ready ? `${plural(r.skipped.length, "PR")} skipped: ${r.skipped.map((s) => `#${esc(s.number)} ${esc(s.reason)}`).join("; ")}` : esc(r.status)}</td></tr>`).join("")}</tbody></table></div></section>` : "";
    const shown = (t.repos ?? []).filter((r) => r.ready && r.path);
    const filter = shown.length > 1 ? `<label class="rfilter">Repo <select id="repo-filter"><option value="">All ${shown.length} repos</option>${shown.map((r) => `<option value="${esc(r.path)}"${r.path === repoFilter ? " selected" : ""}>${esc(r.path)} (${r.open})</option>`).join("")}</select></label>` : "";
    return `
<header class="topbar"><span class="mark"><i></i>PR Triage</span><span class="sep">/</span><span class="mono meta">${esc(repoLabel(t))}</span><span class="grow"></span><span class="meta hide-sm">${esc(when(t.generatedAt))}</span></header>
<main class="main" style="max-width:1240px;margin:0 auto">
<section class="sec">
<h1 style="margin-top:4px">What needs your attention first</h1>
<div class="sub">${judged === prs.length ? "Every open PR was read and judged by the model; each reason links to the line that drives it." : `${judged} of ${prs.length} PRs judged so far — the rest are listed by number.`}</div>
<div class="box strip">
  <div><div class="k">Open PRs</div><div class="v">${prs.length}<small>${prs.filter((p) => p.draft).length} draft</small></div></div>
  <div><div class="k">Critical</div><div class="v" style="color:${count("critical") ? "var(--red)" : "inherit"}">${count("critical")}</div></div>
  <div><div class="k">High</div><div class="v" style="color:${count("high") ? "var(--red)" : "inherit"}">${count("high")}</div></div>
  <div><div class="k">Lines to read</div><div class="v">${fmt(prs.reduce((s, p) => s + p.readLines, 0))}</div></div>
  <div><div class="k">Noise, collapsed</div><div class="v">${fmt(prs.reduce((s, p) => s + p.noiseLines, 0))}<small>lines</small></div></div>
</div></section>
${t.summary ? `<section class="sec"><div class="sec-h">Summary ${MODEL}</div><div class="model">${inline(t.summary)}</div></section>` : ""}
${notTriaged}
<section class="sec"><div class="sec-h">Queue <span class="count">${prs.length} · most attention first</span>${filter}</div>
<div class="box"><table>
<thead><tr><th class="r">#</th><th>Attention</th><th>Pull request · what happened · why</th><th class="r">To read</th><th class="r">Age</th><th></th></tr></thead>
<tbody>${rows}</tbody></table></div></section>
${overlaps}
<div class="footer"><span>Attention is the model's judgement after reading each PR. Blue text is the model's; red dots are facts a script computed from the diff.</span><span>An order to read in — never a verdict. The last PR still gets read.</span></div>
</main>`;
  }

  // ---------- tour ----------
  function renderTour(r, key) {
    const pr = r.pr;
    const files = new Map(r.files.map((f) => [f.path, f]));
    const idx = new Map(r.order.map((o, i) => [o.path, i]));
    const role = new Map(r.order.map((o) => [o.path, o]));
    const href = (id) => `#/pr/${encodeURIComponent(key)}?at=${encodeURIComponent(id)}`;
    const anchor = (path, line, side) => href(`f${idx.get(path)}${line != null ? (side === "old" ? "-o" : "-n") + line : ""}`);
    const loc = (path, line, side) => `<a class="mono" href="${anchor(path, line, side)}">${esc(base(path))}${line != null ? ":" + line : ""}</a>`;
    const link = (target) => { const [p, l] = target.split(/:(\d+)$/); return idx.has(p) ? anchor(p, l ? Number(l) : null) : null; };
    const SRC = { model: 0, map: 1, fact: 2 };
    const items = [...r.items].sort((a, b) => SEV[a.severity] - SEV[b.severity] || SRC[a.source] - SRC[b.source]);
    const worst = (p) => items.filter((x) => x.file === p).reduce((w, x) => Math.min(w, SEV[x.severity]), 9);
    const nonNoise = r.order.filter((o) => o.role !== "noise");
    const noise = r.order.filter((o) => o.role === "noise");
    const lines = (list) => list.reduce((s, o) => s + files.get(o.path).additions + files.get(o.path).deletions, 0);
    const readLines = lines(nonNoise), noiseLines = lines(noise);

    // Chapters: the judge's, or a deterministic fallback from the reading order.
    let chapters = r.chapters?.length ? r.chapters : null;
    if (!chapters) {
      const hot = nonNoise.filter((o) => o.why.startsWith("hotspot") || (o.role === "test" && nonNoise.find((x) => x.path === o.pairedWith)?.why.startsWith("hotspot")));
      const rest = nonNoise.filter((o) => !hot.includes(o));
      chapters = [
        hot.length && { title: "Start here", description: "Files with a high-severity finding, each followed by its tests.", files: hot.map((o) => o.path) },
        rest.length && { title: hot.length ? "The rest" : "Files", description: "Contracts and schema first, then domain, services, and UI; each test right after its code.", files: rest.map((o) => o.path) },
      ].filter(Boolean);
    }
    const label = new Map();
    chapters.forEach((c, ci) => c.files.forEach((p, fi) => label.set(p, `${ci + 1}${String.fromCharCode(97 + Math.min(fi, 25))}`)));

    // --- TL;DR ---
    const a = r.attention;
    const strongest = r.intent.sources.find((s) => s.type !== "title") ?? r.intent.sources[0];
    const lead = strongest ? (strongest.text.split(/(?<=[.!?])\s+/)[0] || strongest.text).slice(0, 240) : null;
    const whyRow = r.why ? `<q>${inline(r.why)}</q><span class="src-note">the author's words</span>`
      : r.intent.status === "UNKNOWN" ? `<span class="unk">No stated reason — no description, issue, or informative title. Ask the author before you read the code.</span>`
      : `<q>${inline(lead)}</q><span class="src-note">${esc(strongest.source)}</span>`;
    const unexplained = r.unexplained ?? [];
    const tldr = `
<section class="sec" id="tldr"><div class="box tldr">
  <div class="tl-head"><span class="tl-tag">TL;DR</span><h1>${inline(a?.whatHappened ?? pr.title)}</h1></div>
  <dl class="tl-rows">
    <dt>What</dt><dd>${r.whatItDoes ? `${inline(r.whatItDoes, link)} ${MODEL}` : `<span class="empty">Not annotated yet.</span>`}</dd>
    <dt>Why</dt><dd>${whyRow}</dd>
    <dt>Attention</dt><dd>${a ? `${att(a.level)} ${inline(a.why)}${a.file ? ` <a class="mono" style="color:var(--blue)" href="${anchor(a.file, a.line, a.side)}">${esc(base(a.file))}${a.line != null ? ":" + a.line : ""}</a>` : ""}` : `<span class="empty">Not judged.</span>`}</dd>
    <dt>Size</dt><dd><span class="num">${fmt(readLines)}</span> lines to read in ${plural(nonNoise.length, "file")}${noise.length ? ` · <span class="num">${fmt(noiseLines)}</span> lines of noise collapsed (${esc([...new Set(noise.map((n) => n.why))].join(", "))})` : ""}</dd>
    <dt>Intent</dt><dd>${r.intent.status === "UNKNOWN" ? `<span class="unk">UNKNOWN</span>` : esc(r.intent.status)}${unexplained.length ? ` · <span style="color:var(--amber)">${plural(unexplained.length, "file")} nothing the author wrote explains:</span> ${unexplained.map((p) => `<a class="fchip warn" href="${anchor(p)}">${esc(base(p))}</a>`).join(" ")}` : r.whatItDoes ? " · every changed file is explained by the author's words" : ""}</dd>
  </dl>
</div></section>`;

    const overview = r.points?.length ? `
<section class="sec" id="overview"><div class="sec-h">Overview ${MODEL}</div><ol class="points">${r.points.map((p) => `<li><span>${inline(p, link)}</span></li>`).join("")}</ol></section>` : "";

    const shapeView = (v) => {
      const body = String(v.code).split("\n").map((l) => {
        if (v.lang === "diff") {
          const cls = l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
          return `<span class="ln ${cls}">${esc(l)}</span>`;
        }
        return `<span class="ln">${highlight(l, v.lang === "sql" ? "sql" : v.lang === "text" ? "plain" : "js")}</span>`;
      }).join("");
      return `<div class="box"><div class="shape-h">${esc(v.title)} <span class="tag tag-src">${esc(v.kind)}</span><span class="grow"></span>${MODEL}</div><pre>${body}</pre></div>`;
    };
    const diagramView = (d) => `<div class="box dgm-box"><div class="shape-h">${esc(d.title)} <span class="tag tag-src">${esc(d.kind)}</span><span class="grow"></span>${MODEL}</div>${d.svg ? `<div class="dgm">${d.svg}</div>` : `<pre class="dgm-fail">${esc(d.mermaid)}</pre>`}${d.caption ? `<div class="dgm-cap">${inline(d.caption, link)}</div>` : ""}</div>`;
    const views = [...(r.diagramsSvg ?? []).map(diagramView), ...(r.shape ?? []).map(shapeView)];
    const shape = views.length ? `
<section class="sec" id="shape"><div class="sec-h">Shape of the change <span class="count">structure before code</span></div><div class="shape">${views.join("")}</div></section>` : "";
    const cm = r.changeMapSvg;
    const changeMap = cm?.svg ? `
<section class="sec" id="map"><div class="sec-h">Where it fits <span class="count">changed files and which uses which · computed from the imports at the PR head · click a file to open it</span></div>
<div class="box dgm-box"><div class="dgm cmap" data-links="${esc(JSON.stringify(Object.fromEntries(Object.entries(cm.links).map(([label, p]) => [label, anchor(p)]))))}">${cm.svg}</div>
<div class="dgm-cap legend"><span><i class="lg lg-hot"></i>high finding</span><span><i class="lg lg-warn"></i>medium finding</span><span><i class="lg lg-test"></i>test</span><span>arrow = uses</span></div></div></section>` : "";

    // --- where to look ---
    const itemRow = (it) => `<div class="item"><div>${sev(it.severity)}</div><div>${src(it.source)}</div><div><div>${inline(it.text)} ${it.file ? `<span class="sep">·</span> ${loc(it.file, it.line, it.side)}` : ""}</div>${it.why ? `<div class="why-t">${inline(it.why)}</div>` : ""}</div></div>`;
    const major = items.filter((it) => it.severity !== "low"), minor = items.filter((it) => it.severity === "low");
    const look = `
<section class="sec" id="look"><div class="sec-h">Where to look <span class="count">${plural(items.length, "item")} · FACT = computed from the diff · LOOK HERE = model, line-checked · ASK WHY = no stated reason</span></div>
<div class="box" style="padding:14px 16px"><div class="items">${!items.length ? `<div class="empty">No facts and no LOOK HERE items.</div>` : major.map(itemRow).join("") + (minor.length ? `<details class="more" style="margin:${major.length ? "4px" : "0"} -12px -6px"><summary><span class="caret">▸</span> ${plural(minor.length, "low-severity item")}</summary><div style="padding:0 12px">${minor.map(itemRow).join("")}</div></details>` : "")}</div></div></section>`;

    // --- evidence: the author's words, intent map, claims ---
    const TYPE = { spec: "SPEC", description: "DESCRIPTION", issue: "ISSUE", commits: "COMMITS", title: "TITLE" };
    const srcBlock = (x) => {
      const head = `<div class="src"><span class="tag tag-src">${TYPE[x.type] ?? esc(x.type)}</span> ${esc(x.source)}</div>`;
      const long = x.text.split("\n").length > 10 || x.text.length > 700;
      return long ? `<details class="more" style="margin:0 -12px"><summary>${head.replace('class="src"', 'class="src" style="display:inline-block;margin:0 0 0 12px"')} <span class="caret">▸</span></summary><div class="quote" style="margin:0 12px 6px">${esc(x.text)}</div></details>` : `${head}<div class="quote">${esc(x.text)}</div>`;
    };
    const chip = (p, cls = "") => `<a class="fchip ${cls || (files.get(p)?.kind === "noise" ? "dim" : "")}" href="${anchor(p)}" title="${esc(p)}">${esc(base(p))}</a>`;
    const allNoise = r.files.every((f) => f.kind === "noise");
    const imap = !r.whatItDoes ? `<div class="empty">Not annotated yet.</div>` : [
      ...(r.explains ?? []).filter((e) => e.files.length).map((e) => `<div class="imap"><div><q>${inline(e.quote)}</q></div><div class="files">${e.files.map((p) => chip(p)).join("")}</div></div>`),
      unexplained.length ? `<div class="imap-h">Not explained by anything the author wrote — ask why</div><div class="imap"><div style="color:var(--mfg)">${plural(unexplained.length, "file")} with no stated reason</div><div class="files">${unexplained.map((p) => chip(p, files.get(p)?.areas?.length ? "bad" : "warn")).join("")}</div></div>`
        : `<div class="imap-h">${allNoise ? "Every change is noise — nothing needs a reason." : "Every changed file is explained by the author's words."}</div>`,
      (r.unmatched ?? []).length ? `<div class="imap-h">Stated, but not visible in this diff</div>${r.unmatched.map((q) => `<div class="imap"><div><q>${inline(q)}</q></div><div class="files"><span class="empty">no matching change</span></div></div>`).join("")}` : "",
    ].join("");
    const claims = (r.claims ?? []).map((c) => `<div class="claim"><q>${inline(c.quote)}</q>${c.file ? ` <span class="sep">→</span> check at ${loc(c.file, c.line, c.side)}` : ""}${c.note ? `<div class="note">${inline(c.note)}</div>` : ""}</div>`).join("");
    const evidence = `
<section class="sec" id="evidence"><div class="sec-h">Intent and evidence</div><div class="box ev-grid">
  <section><h3>The author's words</h3>${r.intent.status === "UNKNOWN" ? `<p class="unk" style="margin:0 0 8px">No stated intent — ask the author first.</p>` : ""}${r.intent.sources.map(srcBlock).join("<div style='height:10px'></div>")}</section>
  <section><h3>Intent map ${MODEL}</h3>${imap}</section>
  ${claims ? `<section class="full"><h3>Claims to check</h3>${claims}</section>` : ""}
</div></section>`;

    // --- walkthrough ---
    const fileCard = (p, open) => {
      const f = files.get(p), o = role.get(p), i = idx.get(p);
      const note = r.fileNotes?.[p];
      const flagged = items.some((x) => x.file === p && x.line != null && x.severity !== "low");
      const total = f.hunks.reduce((s, h) => s + h.lines.length, 0);
      return `<article class="box file ${o.role === "test" ? "test" : ""}" id="f${i}">
  <div class="fh"><span class="step">${esc(label.get(p) ?? "")}</span><span class="path">${esc(p)}</span>${f.status === "renamed" ? `<span class="old">← ${esc(f.oldPath)}</span>` : ""}${f.status === "added" ? `<span class="pill">new</span>` : f.status === "deleted" ? `<span class="pill">deleted</span>` : ""}${(f.areas ?? []).map((x) => `<span class="pill">${esc(x)}</span>`).join("")}<span class="grow"></span><span class="pos hide-sm">${o.role === "test" && o.pairedWith ? `test for <span class="mono">${esc(base(o.pairedWith))}</span>` : ""}</span><span class="num"><span class="plus">+${f.additions}</span> <span class="minus">−${f.deletions}</span></span></div>
  ${note ? `<div class="fnote-md">${MODEL.replace('class="tag', 'class="mtag tag')}${block(note, link)}</div>` : ""}
  <details class="codefold"${open || flagged ? " open" : ""}><summary><span class="caret">▸</span> View changes · ${fmt(total)} lines</summary>${diffTable(f, i, items)}</details>
</article>`;
    };
    const walkthrough = chapters.map((c, ci) => `
<section class="chapter" id="ch${ci + 1}">
  <div class="ch-head"><span class="ch-num">${ci + 1}</span><h2>${inline(c.title)}</h2>${r.chapters?.length ? MODEL : ""}</div>
  ${c.description ? `<p class="ch-desc">${inline(c.description, link)}</p>` : ""}
  ${c.files.map((p) => fileCard(p, ci === 0)).join("")}
</section>`).join("");
    const noiseBlock = noise.length ? `
<section class="sec" id="noise"><div class="sec-h">Noise <span class="count">${plural(noise.length, "file")} · ${fmt(noiseLines)} lines · collapsed because they carry little reading value — not because anyone checked them</span></div>
<div class="box noise">${noise.map((o) => { const f = files.get(o.path); return `<details class="row" id="f${idx.get(o.path)}"><summary><span class="caret">▸</span><span class="p">${esc(o.path)}${f.oldPath && f.oldPath !== f.path ? ` <span style="color:var(--dim)">← ${esc(f.oldPath)}</span>` : ""}</span><span class="pill">${esc(o.why)}</span><span class="num r"><span class="plus">+${f.additions}</span> <span class="minus">−${f.deletions}</span></span></summary>${diffTable(f, idx.get(o.path), items, 400)}</details>`; }).join("")}</div></section>` : "";

    // --- sidebar ---
    const out = (id, num, text, cls = "") => `<li class="${cls}"><a href="${href(id)}" data-target="${id}"><span class="o-num">${num}</span><span class="o-txt">${text}</span><span></span></a></li>`;
    const outline = [
      out("tldr", "—", "TL;DR"),
      overview && out("overview", "—", "Overview"),
      changeMap && out("map", "—", "Where it fits"),
      shape && out("shape", "—", "Shape of the change"),
      out("look", "—", `Where to look <span style="color:var(--dim)">${major.length}</span>`),
      out("evidence", "—", "Intent and evidence"),
      ...chapters.flatMap((c, ci) => [out(`ch${ci + 1}`, ci + 1, inline(c.title), "chap"), ...c.files.map((p) => out(`f${idx.get(p)}`, label.get(p), esc(base(p)), "sub"))]),
      noise.length && out("noise", "…", `Noise <span style="color:var(--dim)">${noise.length}</span>`),
    ].filter(Boolean).join("");
    const ST = { added: "A", deleted: "D", renamed: "R", modified: "M" };
    const flist = r.order.map((o) => {
      const f = files.get(o.path), w = worst(o.path);
      return `<li><a class="${o.role === "noise" ? "noise" : ""}" href="${anchor(o.path)}" title="${esc(o.path)}"><span class="st st-${ST[f.status] ?? "M"}">${ST[f.status] ?? "M"}</span><span class="nm">${esc(short(o.path))}</span><span class="dd"><span class="plus">+${f.additions}</span>${f.deletions ? `<span class="minus">−${f.deletions}</span>` : ""}</span><span class="dot ${w === 0 ? "dot-high" : w === 1 ? "dot-medium" : ""}"></span></a></li>`;
    }).join("");

    const back = DATA.triage ? `<a class="go" href="#/">← Queue</a>` : "";
    return `
<header class="topbar">${back}<button class="menu" aria-label="Contents">☰</button>
  <span class="t-title">${esc(pr.title)}<span class="t-num">#${esc(pr.number)}</span></span>
  ${a ? att(a.level) : ""}<span class="vsep hide-sm"></span>
  <span class="num hide-sm"><span class="plus">+${pr.additions}</span> <span class="minus">−${pr.deletions}</span></span>
  <span class="pill hide-sm">${plural(pr.filesChanged, "file")}</span>
  <span class="meta hide-sm num">${fmt(readLines)} to read${noiseLines ? ` · ${fmt(noiseLines)} noise` : ""}</span>
  <span class="grow"></span>${r.read ? `<span class="pill hide-sm">${esc(r.repo)}</span>` : ""}${pr.url ? `<a class="meta mono hide-sm" href="${esc(pr.url)}">GitHub ↗</a>` : ""}
</header>
<div class="overlay"></div>
<div class="shell">
  <nav class="side" aria-label="Contents">
    <div class="side-sec"><span class="side-label">Walkthrough</span><ul class="outline">${outline}</ul></div>
    <div class="side-sec"><span class="side-label">Files changed (${r.files.length})</span><ul class="flist">${flist}</ul></div>
  </nav>
  <main class="main">
    ${tldr}${overview}${changeMap}${shape}${look}${evidence}
    <section class="sec" style="margin-top:36px"><div class="sec-h">Walkthrough <span class="count">${esc(r.chapters?.length ? "grouped by the judge" : r.orderRule)}</span></div></section>
    ${walkthrough}${noiseBlock}
    <div class="footer"><span>This tour points attention. It gives no merge verdict and no security verdict.</span><span>Collapsed means low reading value, not verified.</span><span>Blue = written by the model.</span></div>
  </main>
</div>`;
  }

  function diffTable(f, i, items, foldAt = Infinity) {
    if (f.binary) return `<div class="empty" style="padding:10px 12px">Binary file.</div>`;
    if (!f.hunks.length) return `<div class="empty" style="padding:10px 12px">${f.status === "renamed" ? "Renamed without content changes." : "No content changes."}</div>`;
    const lang = langOf(f.path);
    const here = items.filter((x) => x.file === f.path && x.line != null);
    // File-level findings only; ASK WHY already shows in the TL;DR, the intent map and Where to look.
    const unanchored = items.filter((x) => x.file === f.path && x.line == null && x.severity !== "low" && x.source !== "map");
    const annBox = (h) => `<div class="ann-box">${sev(h.severity)}${src(h.source)}<div class="t">${inline(h.text)}${h.why ? `<div>${inline(h.why)}</div>` : ""}</div></div>`;
    const rows = (ls) => ls.map((l) => {
      const hits = here.filter((x) => (x.side === "old" ? l.t !== "add" && l.o === x.line : l.t !== "del" && l.n === x.line));
      const s = hits.length ? hits.map((h) => h.severity).sort((x, y) => SEV[x] - SEV[y])[0] : null;
      const id = l.n != null && l.t !== "del" ? `f${i}-n${l.n}` : `f${i}-o${l.o}`;
      return `<tr class="${l.t}${s ? " flag " + s : ""}" id="${id}"><td class="ln">${l.o ?? ""}</td><td class="ln">${l.n ?? ""}</td><td class="code">${highlight(l.s, lang) || " "}</td></tr>`
        + hits.map((h) => `<tr class="ann"><td colspan="3">${annBox(h)}</td></tr>`).join("");
    }).join("");
    const total = f.hunks.reduce((s, h) => s + h.lines.length, 0);
    const table = `<table class="diff">${unanchored.length ? `<tr class="ann"><td colspan="3">${unanchored.map(annBox).join("")}</td></tr>` : ""}${f.hunks.map((h) => `<tr class="hunk"><td colspan="3">${esc(h.header)}</td></tr>${rows(h.lines)}`).join("")}</table>`;
    return total > foldAt && !here.length ? `<details class="more"><summary><span class="caret">▸</span> Show ${fmt(total)} diff lines</summary>${table}</details>` : table;
  }

  // ---------- behaviour: scroll-spy, mobile menu ----------
  let spy = null;
  function wire() {
    window.removeEventListener("scroll", spy);
    const side = app.querySelector(".side"), overlay = app.querySelector(".overlay"), menu = app.querySelector(".menu");
    if (menu) {
      const close = () => { side.classList.remove("is-open"); overlay.classList.remove("is-open"); };
      menu.onclick = () => { side.classList.toggle("is-open"); overlay.classList.toggle("is-open"); };
      overlay.onclick = close;
      side.querySelectorAll("a").forEach((x) => x.addEventListener("click", () => { if (innerWidth <= 900) close(); }));
    }
    // The repo filter hides the other repos' rows and stays set until the page reloads.
    const rf = app.querySelector("#repo-filter");
    if (rf) rf.onchange = () => {
      repoFilter = rf.value;
      for (const row of app.querySelectorAll("tr[data-repo]")) row.hidden = !!repoFilter && row.dataset.repo !== repoFilter;
    };
    // A queue row opens its tour; links inside the row keep their own target.
    for (const row of app.querySelectorAll("tr.qrow")) {
      row.addEventListener("click", (e) => { if (!e.target.closest("a") && !getSelection().toString()) location.hash = row.dataset.href.slice(1); });
      row.addEventListener("keydown", (e) => { if (e.key === "Enter") location.hash = row.dataset.href.slice(1); });
    }
    // Change-map nodes open their file.
    for (const box of app.querySelectorAll(".cmap[data-links]")) {
      const map = JSON.parse(box.dataset.links);
      for (const t of box.querySelectorAll("text")) {
        const target = map[t.textContent.trim()];
        if (!target) continue;
        const g = t.closest("g") ?? t;
        g.style.cursor = "pointer";
        g.addEventListener("click", () => { location.hash = target.slice(1); });
      }
    }
    const links = [...app.querySelectorAll(".outline a[data-target]")];
    if (!links.length) return;
    const targets = links.map((l) => document.getElementById(l.dataset.target));
    let ticking = false;
    spy = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        let active = 0;
        targets.forEach((t, k) => { if (t && t.getBoundingClientRect().top <= 90) active = k; });
        links.forEach((l, k) => l.classList.toggle("is-active", k === active));
        const el = links[active];
        const sr = side.getBoundingClientRect(), er = el.getBoundingClientRect();
        if (er.top < sr.top + 40 || er.bottom > sr.bottom - 40) side.scrollTop += er.top - sr.top - sr.height / 3;
      });
    };
    window.addEventListener("scroll", spy, { passive: true });
    spy();
  }

  route();
})();
</script>
</body></html>
